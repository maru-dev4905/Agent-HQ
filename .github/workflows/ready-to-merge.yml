# Notifies the repository owner when a PR is ready to merge (HQ-004, HQ-006).
# Every check on the latest commit must succeed. Risk labels decide whether CodeRabbit must
# also approve (review-protocol §6): `risk:0`/`risk:1` → CI only; `risk:2`/`risk:3` or no
# risk label → CodeRabbit approval of the latest commit as well.
# Adds the `ready-to-merge` label plus a mention (GitHub notification); removes the label on new pushes.
name: ready-to-merge

on:
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

# Serialize evaluations per PR so a run for an older commit cannot label after a newer push.
concurrency:
  group: ready-to-merge-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: this job never runs code from the PR.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const LABEL = 'ready-to-merge';
            const MARKER = (sha) => `<!-- ready-to-merge:${sha} -->`;
            const BOT = 'coderabbitai[bot]';
            const REQUIRED_CHECKS = ['verify (G1 G2 G3 G6)', 'integration (G4)'];
            const OK = new Set(['success', 'neutral', 'skipped']);
            // Highest risk label wins; a PR without one is treated as the strictest level.
            const riskOf = (labels) => {
              const levels = labels.map((l) => /^risk:([0-3])$/.exec(l.name)?.[1]).filter(Boolean).map(Number);
              return levels.length === 0 ? 3 : Math.max(...levels);
            };
            const { owner, repo } = context.repo;

            const prNumbers =
              context.eventName === 'workflow_run'
                ? (context.payload.workflow_run.pull_requests ?? []).map((p) => p.number)
                : [context.payload.pull_request.number];

            for (const number of prNumbers) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              const hasLabel = pr.labels.some((l) => l.name === LABEL);
              const removeLabel = async (reason) => {
                if (!hasLabel) return;
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: LABEL });
                core.info(`#${number}: label removed (${reason})`);
              };

              if (pr.state !== 'open' || pr.draft) { await removeLabel('not open'); continue; }
              const action = context.payload.action;
              if (context.eventName === 'pull_request' && (action === 'synchronize' || action === 'reopened')) {
                await removeLabel('new commits');
                continue;
              }
              // A change of our own label must not trigger another evaluation loop.
              if (context.eventName === 'pull_request' && context.payload.label?.name === LABEL) continue;
              const risk = riskOf(pr.labels);
              const needsCodeRabbit = risk >= 2;

              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number });
              const decisive = reviews.filter((r) => r.user?.login === BOT && ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state));
              const latest = decisive.at(-1);
              const approved = latest?.state === 'APPROVED' && latest.commit_id === pr.head.sha;

              const runs = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: pr.head.sha, per_page: 100 });
              const relevant = runs.filter((r) => r.name !== 'evaluate');
              const requiredPresent = REQUIRED_CHECKS.every((name) => relevant.some((r) => r.name === name));
              const allGreen = relevant.every((r) => r.status === 'completed' && OK.has(r.conclusion));
              const ready = (!needsCodeRabbit || approved) && requiredPresent && allGreen;
              core.info(`#${number}: risk=${risk} approved=${approved} required=${requiredPresent} green=${allGreen}`);

              if (!ready) { await removeLabel('not ready'); continue; }

              // Label and notification are tracked separately so a failed comment is retried.
              if (!hasLabel) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [LABEL] });
              }
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
              const notified = comments.some((c) => c.body?.includes(MARKER(pr.head.sha)));
              if (notified) continue;
              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: needsCodeRabbit
                  ? `${MARKER(pr.head.sha)}\n@${owner} 머지 준비 완료 (risk:${risk}): CodeRabbit이 최신 커밋(${pr.head.sha.slice(0, 7)})을 승인했고 모든 check가 통과했습니다.`
                  : `${MARKER(pr.head.sha)}\n@${owner} 머지 준비 완료 (risk:${risk}): 최신 커밋(${pr.head.sha.slice(0, 7)})의 모든 check가 통과했습니다. 이 위험도는 CodeRabbit 승인이 필요 없습니다.`,
              });
            }
